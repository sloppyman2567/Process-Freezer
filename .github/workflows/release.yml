name: Release

# One executable per release: a single-file ELF for 64-bit Linux, built on
# Ubuntu 24.04 so it needs glibc 2.39 or newer.
#
# Two ways in: pushing a v* tag by hand, or the CI workflow calling this one
# when the version in the tree is new. The second path publishes on merge and
# creates the tag with the release, because a tag pushed with the workflow's own
# token would not start a run of its own.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, for example v1.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86-64 ELF (glibc 2.39)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(python3 -c "import processfreezer; print(processfreezer.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in processfreezer/__init__.py"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the build host's glibc
        run: |
          glibc=$(getconf GNU_LIBC_VERSION | awk '{print $2}')
          echo "Build host glibc: $glibc"
          # PyInstaller links against the build host, so the host decides what
          # the binary needs at runtime. Ubuntu 24.04 is the glibc 2.39 target;
          # a different host would make the release name a lie.
          if [ "$glibc" != "2.39" ]; then
            echo "::error::Build host has glibc $glibc, but this release targets glibc 2.39."
            exit 1
          fi

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          # The Qt libraries are needed now, not just to run: PyInstaller's Qt
          # hooks import PyQt6 modules while analysing the entry point, and Qt
          # links libglib, libgssapi_krb5 and friends at import time.
          sudo apt-get install --yes --no-install-recommends \
            python3 python3-venv libpython3.12 \
            binutils fonts-dejavu-core \
            libgl1 libegl1 libglib2.0-0 libgssapi-krb5-2 libfontconfig1 \
            libfreetype6 libpng16-16 libjpeg-turbo8 libharfbuzz0b \
            libxkbcommon0 libdbus-1-3
          # Build with the distro Python 3.12: it is compiled against this
          # image's glibc 2.39, and PyInstaller needs its shared library
          # (libpython3.12) to bundle. A downloaded Python would be a second
          # toolchain to keep in step with the target.
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "pyinstaller>=6.10" .

      - name: Build the executable
        run: |
          pyinstaller --clean --noconfirm --onefile --name process-freezer \
            --paths . \
            --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller \
            packaging/entry.py

      - name: Smoke-test the executable
        run: |
          binary=dist/process-freezer
          file "$binary"
          file "$binary" | grep -q "ELF 64-bit LSB" || { echo "::error::$binary is not an ELF"; exit 1; }
          file "$binary" | grep -q "x86-64" || { echo "::error::$binary is not x86-64"; exit 1; }
          # A frozen build has no interpreter left for `-c` or `-m`, so the thaw
          # watchdog goes through the app's hidden --watchdog flag. Running it
          # here proves that path exists and that the bundle unpacks.
          printf 'start' | timeout 60 "$binary" --watchdog process-freezer-0-0.scope 0
          # A GUI cannot be asked to quit, so start it offscreen and check it is
          # still alive after a few seconds. timeout's 124 means it was.
          status=0
          QT_QPA_PLATFORM=offscreen timeout 10 "$binary" > /tmp/smoke.log 2>&1 || status=$?
          cat /tmp/smoke.log
          if [ "$status" -ne 124 ]; then
            echo "::error::The window exited with status $status instead of staying up."
            exit 1
          fi
          if grep -q "Traceback" /tmp/smoke.log; then
            echo "::error::The window logged a traceback."
            exit 1
          fi

      - name: Check the glibc floor of the bundle
        run: |
          # The bundle unpacks itself on start, and those unpacked libraries are
          # what a user's machine actually links against; the outer ELF is only
          # the bootloader. Building on 24.04 sets the floor, but this catches a
          # dependency wheel that moved to a newer glibc without the name
          # saying so.
          mkdir -p /tmp/extract
          TMPDIR=/tmp/extract QT_QPA_PLATFORM=offscreen dist/process-freezer > /tmp/floor.log 2>&1 &
          pid=$!
          set +e
          dir=""
          for _ in $(seq 120); do
            dir=$(find /tmp/extract -maxdepth 1 -type d -name '_MEI*' | head -1)
            [ -n "$dir" ] && break
            sleep 0.25
          done
          set -e
          if [ -z "$dir" ]; then
            echo "::error::The bundle never unpacked."
            cat /tmp/floor.log
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          # The directory appears before it is full: the bootloader writes the
          # files one at a time, so counting straight away sees the first entry
          # alone. Wait for the libraries to reach a plausible number, then let
          # the last write land before measuring.
          libs=0
          for _ in $(seq 120); do
            libs=$(find "$dir" -type f -name '*.so*' 2>/dev/null | wc -l)
            [ "$libs" -ge 10 ] && break
            sleep 0.5
          done
          sleep 1
          libs=$(find "$dir" -type f -name '*.so*' 2>/dev/null | wc -l)
          # The bundle deletes its unpacked directory on exit, so it has to be
          # measured while the app is still running.
          if [ "$libs" -lt 10 ]; then
            echo "::error::Only $libs libraries unpacked; the bundle looks incomplete."
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          highest=$( (objdump -T dist/process-freezer; find "$dir" -type f -name '*.so*' -exec objdump -T {} +) 2>/dev/null \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "Highest glibc symbol version in $libs bundled libraries: ${highest:-none found}"
          if [ -z "$highest" ]; then
            echo "::error::Could not read any glibc symbol versions out of the bundle."
            exit 1
          fi
          newest=$(printf '%s\n2.39\n' "$highest" | sort -Vu | tail -1)
          if [ "$newest" != "2.39" ]; then
            echo "::error::The bundle needs glibc $highest, newer than the 2.39 this release promises."
            exit 1
          fi

      - name: Name the artefacts
        run: |
          stem="process-freezer-$VERSION-linux-x86_64-glibc2.39"
          mkdir -p release
          cp dist/process-freezer "release/$stem"
          chmod +x "release/$stem"
          (cd release && sha256sum "$stem" > "$stem.sha256")
          ls -l release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Re-running a failed build must not fail on the existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # The tag was pushed by hand, so publish exactly that commit.
            gh release create "$TAG" release/* \
              --title "Process Freezer $VERSION" --generate-notes --verify-tag
          else
            # Called from CI after a version bump: the tag does not exist yet,
            # so the release creates it at the commit that was built.
            gh release create "$TAG" release/* \
              --title "Process Freezer $VERSION" --generate-notes \
              --target "$GITHUB_SHA"
          fi
