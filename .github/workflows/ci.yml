name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor in pyproject.toml; 3.12 is what 24.04 ships.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # PyQt6 links against these, even when it only draws offscreen.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libgssapi-krb5-2 libxkbcommon0 libdbus-1-3

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Byte-compile the package
        run: python -m compileall -q processfreezer

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  # A push to main that changes the version is a release. The tag is created by
  # the release itself: a tag pushed with this workflow's token would not start
  # the Release workflow, so the build is called directly instead.
  version:
    name: Check for a new version
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its tag
        id: check
        run: |
          version=$(python3 -c "import processfreezer; print(processfreezer.__version__)")
          tag="v$version"
          echo "Version in the tree: $version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag is new; the release job will build and publish it."

  release:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
