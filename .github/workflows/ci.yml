name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor in pyproject.toml; 3.12 is what 24.04 ships.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # PyQt6 links against these, even when it only draws offscreen.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libgssapi-krb5-2 libxkbcommon0 libdbus-1-3

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Byte-compile the package
        run: python -m compileall -q processfreezer

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
